<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mi página web</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			font-family: Arial, sans-serif;
			color: #24334a;
			background: #f1f5f9;
		}
		main {
			width: min(100%, 560px);
			padding: 40px 28px;
			text-align: center;
			background: white;
			border-radius: 16px;
			box-shadow: 0 10px 30px #24334a18;
		}
		h1 { margin: 0 0 12px; color: #2563eb; }
		p { margin: 0 0 24px; line-height: 1.6; color: #526174; }
		a {
			display: inline-block;
			padding: 12px 20px;
			border-radius: 8px;
			background: #2563eb;
			color: white;
			text-decoration: none;
		}
		a:hover, a:focus-visible { background: #1d4ed8; }
	</style>
</head>
<body>
	<main>
		<h1>¡Hola!</h1>
		<p>Bienvenido a mi página web. Un lugar sencillo para compartir ideas y novedades.</p>
		<a href="mailto:hola@ejemplo.com">Contáctame</a>
	</main>
</body>
</html>
